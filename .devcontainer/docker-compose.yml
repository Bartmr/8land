version: '3.7'
name: 8land

services:
  devcontainer:
    build: 
      context: devcontainer
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace
    command: sleep infinity

  postgres:
    image: postgres
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - 5432:5432